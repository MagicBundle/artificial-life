name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly slow suite
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75  # the fast suite takes 30-60 min on ubuntu-latest when a PR changes src (cold JIT cache; DESIGN §22.0)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # MLX's CPU backend JIT-compiles fused kernels with g++ into $TMPDIR/mlx; a cold cache roughly triples
      # the fast suite (§22.0 budget), so keep it across runs.
      - name: MLX JIT cache dir
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mlx
          key: ${{ runner.os }}-mlx-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/alife/**/*.py') }}
          restore-keys: ${{ runner.os }}-mlx-${{ hashFiles('uv.lock') }}-
      - name: Install
        # The extras let the pygame viewer loop test and the ffmpeg video test run instead of skipping.
        run: uv sync --locked --group dev --extra viewer --extra video
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Tests
        run: uv run pytest -m "not slow" -q

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # MLX's CPU backend JIT-compiles fused kernels with g++ into $TMPDIR/mlx; a cold cache roughly triples
      # the fast suite (§22.0 budget), so keep it across runs.
      - name: MLX JIT cache dir
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mlx
          key: ${{ runner.os }}-mlx-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/alife/**/*.py') }}
          restore-keys: ${{ runner.os }}-mlx-${{ hashFiles('uv.lock') }}-
      - name: Install
        run: uv sync --locked --group dev
      - name: Slow tests
        run: uv run pytest -m slow -q
