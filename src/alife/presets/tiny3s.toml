# tiny3s: the tiny sphere world for tests, CI and first looks (N = 1 024, M = 32; DESIGN section 46, sphere
# series PR S2). A planet of radius 36 with a shell of thickness 16 (the box's tiny3d is 128 x 128 x 24 with the
# same volume, 0.39 M, and the same floor area to 1 %): HEALPix Nside 8 (768 angular cells) and 8 equal-volume
# layers (6 144 field cells of about 64 units^3), a hash of Nside 8 with 5 radial layers, gravity pulling towards
# the centre, a floor at radius 36 + r and a hard lid at 52 - r. Everything else is tiny3d's. The values are
# provisional until the calibration (docs/SPHERE.md S7). The five feature layers (structures, niche, comm,
# bonds with roles, arms) run on it since PR S3; the weather is refused until PR S4 (config.SPHERE_READY);
# `world.size` is only the image length of min_image and must exceed 4 (radius + height) = 208.
[population]
n_max = 1024
n_init = 256
max_births_per_step = 32

[world]
geometry = "sphere"
size = 1024.0
dims = 3
height = 16.0
radius = 36.0
nside = 8
layers = 8

[physics]
gravity = 0.03
floor_eps = 0.1
buoyancy_max = 0.04

[sensing]
# The lid hash cell is the largest: C >= ceil(0.167 V_lid) + 4 = 28 at Nh = 8 (validate); 32 is provisional.
cell_capacity = 32

[energy]
# Hovering against gravity costs the same by either means: buoyancy (buoy_cap*b = 0.75) is
# floor(16*0.75^2) = 9 q/step, thrust at full pitch (a = 0.305) floor(100*0.305^2) = 9 q/step.
buoyancy_cost = 16
# The upkeep: 4 q/step for a founder's cap of 0.5, 8 at the full cap (basal_cost is 100).
buoyancy_cap_cost = 8

[mutation]
buoy_init = 0.5
buoy_sigma = 0.02

[fields]
n_patches = 4
patch_sigma = 12.0
chem_diffusion = [0.16, 0.10, 0.16]  # sub-stepped on the shell (DESIGN 46.5), no 1/6 limit
benthic_lambda = 8.0
photic_amp = 0.5
photic_lambda = 8.0

[run]
steps = 500
metrics_every = 10
checkpoint_every = 50
heavy_metrics_every = 10
