# stormsph128 overlay: the storm world's weather layer on the `128k3s` planet (DESIGN §46.6, §46.9, row I101). A WORLD
# overlay, like `stormsph`: it needs the planet it is tuned for and fails validation on the others. It is made for the
# `128k3s` world (Rp 128.6, H 40, field Nside 30, so the weather Nside Nw = 2 Nf = 60, 43 200 cells of side 2.19; the
# weather time step per engine step is derived, as for the other planets). Calibrated 2026-11-05 (measured; the values
# below are the ones pinned by `tests/test_sphere_presets.py`).
#
# The same storm density as 64k3s: pools per hemisphere by circumference (3 -> 4, at 40 x 20, amplitude 1, latitude
# +-40 degrees, 90 degrees apart, the southern ones offset by 45), the band of named storms scales by area (2 to 6 ->
# 3 to 8 per hemisphere) and so does the seed rate (0.05 -> 0.102).
#
# **The friction is 2.5 times the default** (`r1` 5e-4, `r2` 2.5e-4 against 2e-4 and 1e-4): the stability gate. The
# dry rotating noise grows with the grid (`tests/sphere_weather_stab.dominant_rate`, 96 000 steps, growth per step: +0.13e-5
# at Nw 42, +11.7e-5 at Nw 60), so friction must rise with the planet. At Nw 60: friction x1 nominal +1.26e-5, halved
# +6.1e-5, quartered +8.6e-5 (FAIL); x2.5 nominal -0.49e-5, halved -1.02e-5, quartered +4.8e-5 (PASS).
#
# The sweep (`python -m alife.analysis.w0_sphere sweep`, weather alone, 80 000 steps, window after 20 000, band 3 to 8):
# 4 pools 40 x 20 at seed_rate 0.071 / 0.102 / 0.143: in band in both hemispheres 0.88 / 0.92 / 0.70; 5 pools 36 x 18:
# 0.22; 4 pools 36 x 18: 0.01. Five seeds of the chosen 0.102: in band 0.92, 0.60, 0.88, 0.88, 0.80 (mean 0.82), a
# Kaplan-Meier median life of 22 600, 14 600, 19 000, 28 800 and 20 300 steps, 13 to 26 deaths per 60 000-step window =
# 1.1 to 2.1 per 10 000 steps per 64k3s-area (64k3s: 0.9 to 1.8), D5 count 0.99 to 1.0. Seed rate 0.071 on five seeds: in
# band 0.88, 0.79, 0.85, 0.98, 0.99 (mean 0.90) but only 0.5 to 1.0 deaths per 10 000 per 64k3s-area, towards the
# frozen world; the owner chose 0.102 (2026-11-05). The lower in-band share comes from the band's floor: a mean of
# about 3.4 named storms per hemisphere against a floor of 3 (64k3s: 2.9 against 2).
#
# Spin-up (`weather_spinup.SPHERE_SPINUP`, the launcher's table): the weather of the five seeds settled at 17 000 to
# 24 000 steps (humidity the slow variable; kinetic energy 5 500 to 6 500, storms formed 4 500 to 12 500), so the
# launcher asks 1.3 x 24 000 = 32 000.
#
# The couplings (engine `alife run`, 3 000 steps from the founders after the 32 000 spin-up, seed 0): `rain_gain`
# 52 000 gave `rain_global_share` 4.9e-4; **85 000** gives 8.3e-4 (64k3s 8.5e-4, the box 8.0e-4). The largest air speed an
# agent meets is 0.079 on average and 0.091 at the peak, so `storm_u0` 0.09 kept the onset of the hazard just above it
# (64k3s: 0.089); the storm exposure of the agents was 2e-7 (64k3s 6e-6). `storm_p` and `storm_span` are the box's.
#
# **The storm is a hazard (I102, the owner's choice of 2026-11-06: storms kill 3 to 10 % of what dies).** At 0.09 the
# storm kills almost nothing, so `storm_u0` is lowered; it is read only by the hazard mask, the validators and the
# exposure metric, never by the weather, whose statistics above are unchanged. Ladder (engine `alife run`, 3 000 steps
# from the founders after the 32 000 spin-up, seed 0; storm deaths as a share of all deaths after step 1 000): `storm_u0`
# 0.055 / 0.045 / 0.035 / 0.025 / **0.020** gave 0.16 / 0.50 / 1.65 / 3.52 / **5.75 %** (storm exposure 0.0007 / 0.0023 /
# 0.0071 / 0.0158 / 0.0261; population at step 3 000 30 600 / 30 400 / 29 900 / 28 600 / 26 900). The onset now lies
# well inside the agents' range of air speed, so the hazard falls on the strongest winds wherever they blow, in a named
# storm or not. Measured on founders: an evolved population may learn to avoid the wind (the calls pilot, DESIGN §47.6).
#
# `weather.cells` is the weather Nside Nw (not a grid side) and must be Nf times a power of two. A pool is
# (x, y, sx, sy, amp, vx, vy) as in `stormsph`; `vx` -0.01286 is the drift along the pool's own latitude circle per
# unit of weather time. The pools are `alife.analysis.w0_sphere.make_pools(128.6, 4, 40, 20)`.
# The vertical map of the shell onto the atmosphere is s = (H1 + H2)/H = 2 here.
[weather]
enabled = true
cells = 60
f0 = 0.025
seed_rate = 0.102
pools = [134.669605, 89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0, 336.674013, 89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0, 538.67842, 89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0, 740.682828, 89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0, 33.667401, -89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0, 235.671809, -89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0, 437.676217, -89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0, 639.680624, -89.779737, 40.0, 20.0, 1.0, -0.01286, 0.0]
rain_gain = 85000.0
storm_p = 0.002
storm_u0 = 0.02  # I102 (hazard); 0.09 in I101
storm_span = 0.03
r1 = 0.0005
r2 = 0.00025
