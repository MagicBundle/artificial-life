# stormsph576 overlay: the storm world's weather layer on the `576k3s` planet (DESIGN §46.6, §46.9, row I101). A WORLD
# overlay, like `stormsph`: it needs the planet it is tuned for and fails validation on the others. It is made for the
# `576k3s` world (Rp 270, H 40, field Nside 63, so the weather Nside Nw = 2 Nf = 126, 190 512 cells of side 2.19; the
# weather time step per engine step is derived, as for the other planets). Calibrated 2026-11-06 (measured; the values
# below are the ones pinned by `tests/test_sphere_presets.py`).
#
# The same storm density as 64k3s: pools per hemisphere by circumference (3 -> 9, amplitude 1, latitude +-40 degrees,
# 40 degrees apart, the northern ones offset by 20), the band of named storms scales by area (2 to 6 -> 6 to 18 per
# hemisphere) and so does the seed rate, then the pool size and the seed rate were tuned for the same storm turnover.
#
# **The friction is 8 times the default** (`r1` 1.6e-3, `r2` 8e-4 against 2e-4 and 1e-4): the stability gate
# (`tests/sphere_weather_stab.dominant_rate`, 96 000 steps, growth per step). The dry noise is +30e-5 at Nw 126; x8
# nominal about 0, halved (x4) -0.79e-5, quartered (x2) +15e-5 (PASS).
#
# The sweep (`python -m alife.analysis.w0_sphere sweep`, weather alone, 80 000 steps, window after 20 000, band 6 to 18).
# Under this friction the flow is weak (kinetic energy about 40 % of 256k3s's with 44 x 22 pools) and **the pool width
# is a narrow window**: 9 pools 44 x 22 at seed_rate 0.45 / 0.90 and 42 x 21 at 0.675 name almost no storms (0.03 to 0.26
# per hemisphere, median life 425 to 1 000 steps); 50 x 25 at 0.70 and 52 x 26 at 0.90 break into short-lived eddies
# (in band 0.01 / 0; 2.8 / 3.1 deaths per 10 000 steps per 64k3s-area); 48 x 24 works: at seed_rate 0.45 in band 0.999
# but frozen (0.41), at 0.60 0.84 / 0.80, at 0.70 0.81 / 0.94, at 0.90 0.72 / 1.37. Five seeds of each finalist:
# 48 x 24 at **0.80**: in band 0.77, 0.76, 0.95, 0.82, 0.70 (mean 0.80; 6.4 to 7.6 named storms per hemisphere), 56 to
# 76 deaths per 60 000-step window = 1.04 to 1.41 per 10 000 steps per 64k3s-area (mean 1.18; 64k3s 0.9 to 1.8,
# 256k3s 1.16), a Kaplan-Meier median life of 11 900, 11 400, 12 300, 10 700 and 13 100 steps, D5 count 1.0; 48 x 24 at
# 0.70: in band 0.66 to 0.94 (mean 0.84) but 0.89 to 1.09 per 64k3s-area, at the floor of the turnover. Chosen: 0.80,
# the turnover of 256k3s (and the owner's 128k3s choice of turnover over the in-band share).
#
# Spin-up (`weather_spinup.SPHERE_SPINUP`, the launcher's table): the weather of the five seeds settled at 14 500 to
# 27 000 steps (the named-storm count the slow variable here; kinetic energy 8 500 to 9 500), so the launcher asks
# 1.3 x 27 000 = 35 000.
#
# The couplings (engine `alife run`, 3 000 steps from the founders after the 35 000 spin-up, seed 0): `rain_gain`
# 52 000 gave `rain_global_share` 4.2e-4 and 105 000 gave 9.0e-4; **100 000** gives 8.6e-4 (64k3s 8.5e-4, 128k3s
# 8.3e-4, 256k3s 8.6e-4). The largest air speed an agent meets is 0.067 on average and 0.078 at the peak, lower than on
# the smaller planets, so **`storm_u0` is 0.08** (not 0.09) to keep the onset of the hazard just above it, the rule of
# 64k3s and 128k3s; no agent met a hazardous wind in those 3 000 steps (storm exposure 0). `storm_p` and `storm_span` are
# the box's.
#
# `weather.cells` is the weather Nside Nw (not a grid side) and must be Nf times a power of two. A pool is
# (x, y, sx, sy, amp, vx, vy) as in `stormsph`; `vx` -0.027 is the drift along the pool's own latitude circle per
# unit of weather time. The pools are `alife.analysis.w0_sphere.make_pools(270.0, 9, 48, 24)`.
# The vertical map of the shell onto the atmosphere is s = (H1 + H2)/H = 2 here.
[weather]
enabled = true
cells = 126
f0 = 0.025
seed_rate = 0.8
pools = [94.24778, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 282.743339, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 471.238898, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 659.734457, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 848.230016, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 1036.725576, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 1225.221135, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 1413.716694, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 1602.212253, 188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 0.0, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 188.495559, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 376.991118, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 565.486678, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 753.982237, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 942.477796, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 1130.973355, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 1319.468915, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0, 1507.964474, -188.495559, 48.0, 24.0, 1.0, -0.027, 0.0]
