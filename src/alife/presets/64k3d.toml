# 64k3d: the 3D world at 64k scale (N = 65 536, M = 1 024; DESIGN §27.13). A 320 x 320 x 80 water column
# with a floor and a surface (FG = 80, FZ = 20 field layers, a 53 x 53 x 13 hash grid), gravity, the buoyancy
# actuator and a benthic plus photic food profile. One key per line: the GUI reads the scalars of this file.
# The run cadences are the 64k ones (the dataclass defaults: metrics every 100 steps, heavy every 1 000).
#
# PROVISIONAL. The values come from the cloud tuning runs on tiny3d and DEV3D (CPU, DESIGN §27.13) and from
# the sizing arithmetic below; none of it has been measured at this size. To be confirmed on the Mac, once the
# GPU is free: `alife bench --preset 64k3d --stages` (time and memory of the 27 * C = 1 296 neighbour candidates
# per agent at C = 48), `cell_overflow` and `max_occupancy` at the benthic steady state of a real run (C), and a
# tuning run (the population against K_est, and the director's risk_k_frac before any 3D director run).
[population]
n_max = 65536
# n_init = 16 384, 0.49 of the K_est of about 33 600 below (the owner asked for "near K"; this is a hedge, to be
# signed off). The founders all start with a surplus, so the first generation multiplies the population by 1.4 to
# 1.7 within about 100 steps (tiny3d 256 -> 442, a peak at step 64; DEV3D of the sizing tests 4 096 -> 6 827,
# a peak at step 57): 16 384 peaks at 23 000 to 28 000, which is 0.68 to 0.83 of K_est. The population then falls
# back: tiny3d is at 0.2 to 0.35 of the occupancy-weighted K_est for thousands of steps at this gravity and DEV3D
# at 0.24 to 0.25 (0.7 of the floor-only K_est). That seeding at K_est would overshoot and crash is an
# extrapolation: the cloud DEV3D that crashed was seeded 2.5x its 70% K_est (5x its floor-only one).
n_init = 16384
max_births_per_step = 1024

[world]
size = 320.0
dims = 3
height = 80.0

[physics]
# 0.015, between the cloud sweeps on tiny3d: clade-specific depth niches at 0.01 (about 40 % of the agents
# grounded, clade-height information 0.70) and a mostly benthic population at 0.03 (76 to 83 %, 0.30 to 0.41).
# Sinking is 0.015 per step and climbing at full pitch 0.0835. Hovering costs about 2 q/step either way:
# thrust at a = 0.015 / (0.1 sin 80 deg) = 0.152 is floor(100 * 0.152^2) = 2, buoyancy at 0.375 of its
# maximum is floor(16 * 0.375^2) = 2. A founder's cap (0.5) can lift 0.02 > gravity.
gravity = 0.015
floor_eps = 0.1
# thrust_max + max(gravity, buoyancy_max - gravity) = 0.125 < 2 r k_repel = 0.16 (validate).
buoyancy_max = 0.04

[sensing]
# K = 8: K = 12 cannot pass validation at the default physics (stability needs k_repel <= 0.058, non-penetration
# needs more than 0.0625 at this gravity), and it barely changed the ecology where it could run.
k_neighbors = 8
# C = 48, PROVISIONAL, pending `alife bench --preset 64k3d --stages` on the Mac. It was 24 until the cloud run of
# the slow DEV3D test (cloud-7, C = 24): one floor hash cell was first over capacity at step 2151 (5 steps) and then
# continuously from step 2207 to the end of the run, a floor pile still growing (peak occupancy 31, over C on 11.96 %
# of the steps against a 1 % gate). Earlier cloud evidence: a floor pile under gravity reached 28 agents per hash
# cell in the crowd tests (a converging ball without gravity 36), no cell overflowed at C = 16 on tiny3d and DEV3D
# at the default regen_max of 320 (peak occupancy 13), and the food at regen_max 1 700 can feed about 20 agents in
# the hottest floor hash cell (p99 20, max 23; 2D 64k: max 5 against C = 16). C = 48 holds the pile of 31 with a
# margin of 1.5x. The price: Q = 27 C = 1 296 candidates per agent (2D 144, 648 at C = 24), about 2.1x the step
# time of C = 16 and 1.6x that of C = 24 on the cloud CPU (DEV3D), and (N, Q) neighbour-search transients of 340 MB
# each (170 MB at C = 24). If the bench finds C = 48 too costly, the alternative is a lower regen_max (fewer
# agents per cell, K_est recalibrated).
cell_capacity = 48

[energy]
# Keeps a founder's brain cost at the 2D value: its expected L1 is 10.5 % larger than in 2D (4 999 weights
# against 4 387), so 0.1 / 1.105: founder_brain_cost is 37.63 q/step against 37.64.
brain_cost_per_l1 = 0.0905
# The cloud grid (use cost 4 to 16, upkeep 2 to 8) found no systematic effect of either. The upkeep sets the
# energy share of the cap: 4 q/step at a founder's cap of 0.5, about 3 % of its basal and brain cost.
buoyancy_cost = 16
buoyancy_cap_cost = 8

[mutation]
buoy_init = 0.5
buoy_sigma = 0.02

[fields]
n_patches = 8
patch_sigma = 24.0
# regen_max = 1 700 gives a K_est (occupancy-weighted, DESIGN §27.10) of about 33 000 at a mostly benthic
# steady state, taken as 70 % of the agents in the floor layer and the rest spread evenly over the other 19.
# 70 % is an upper-end assumption (tiny3d reaches it after thousands of steps, DEV3D read 48 % at 2 500 steps);
# at 60 % K_est is 38 800, at 50 % 44 100.
# Mean of 16 seeds, c_ref 191.63 (mean floor fertility 0.31): floor layer only 17 800, 90 % in it 23 100,
# 80 % 28 300, 70 % 33 600, 60 % 38 800, 50 % 44 100; founders uniform in the volume (the step-0 value) 61 500.
regen_max = 1700
chem_diffusion = [0.16, 0.10, 0.16]  # <= 1/6: the explicit 7-point stencil
benthic_lambda = 8.0
photic_amp = 0.5
photic_lambda = 8.0
