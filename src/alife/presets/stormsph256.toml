# stormsph256 overlay: the storm world's weather layer on the `256k3s` planet (DESIGN §46.6, §46.9, row I101). A WORLD
# overlay, like `stormsph`: it needs the planet it is tuned for and fails validation on the others. It is made for the
# `256k3s` world (Rp 180, H 40, field Nside 42, so the weather Nside Nw = 2 Nf = 84, 84 672 cells of side 2.19; the
# weather time step per engine step is derived, as for the other planets). Calibrated 2026-11-06 (measured; the values
# below are the ones pinned by `tests/test_sphere_presets.py`).
#
# The same storm density as 64k3s: pools per hemisphere by circumference (3 -> 6, amplitude 1, latitude +-40 degrees,
# 60 degrees apart, the southern ones offset by 30), the band of named storms scales by area (2 to 6 -> 4 to 12 per
# hemisphere) and so does the seed rate, then the pool size and the seed rate were tuned for the same storm turnover.
#
# **The friction is 6 times the default** (`r1` 1.2e-3, `r2` 6e-4 against 2e-4 and 1e-4): the stability gate
# (`tests/sphere_weather_stab.dominant_rate`, 96 000 steps, growth per step). At Nw 84: x1.25 +11.4e-5, x2.5 +1.05e-5,
# x5 about 0; x6 nominal about 0, halved (x3) -2.85e-5, quartered (x1.5) +9.2e-5 (PASS).
#
# The sweep (`python -m alife.analysis.w0_sphere sweep`, weather alone, 80 000 steps, window after 20 000, band 4 to 12):
# under this friction the 64k3s-sized pools are too weak to name storms (6 pools 40 x 20 at seed_rate 0.20 / 0.14: 1.8 /
# 1.6 named storms per hemisphere, in band 0; 5 pools 40 x 20: 1.0, in band 0), and the pool width decides. 6 pools 44 x 22
# at seed_rate 0.20: in band 1.0 but frozen (6 deaths in 60 000 steps); at 0.30: frozen too (0.50 deaths per 10 000 steps
# per 64k3s-area); at **0.40**: in band 1.0, 1.12. 6 pools 42 x 21 at 0.20 / 0.30: in band 0.975 / 0.925, 0.67 / 0.96.
# Five seeds of each finalist: 44 x 22 at 0.40: in band 1.000 on every seed (5.9 to 6.0 named storms per hemisphere),
# 17 to 33 deaths per 60 000-step window = 0.71 to 1.38 per 10 000 steps per 64k3s-area (mean 1.16; 64k3s 0.9 to 1.8), a
# Kaplan-Meier median life of 12 200, 10 700, 17 600, 2 400 and 7 400 steps, D5 count 1.0; 42 x 21 at 0.30: in band 0.92
# to 1.0 but 0.42 to 1.13 deaths per 64k3s-area (mean 0.86), towards the frozen world. Chosen: 44 x 22 at 0.40.
#
# Spin-up (`weather_spinup.SPHERE_SPINUP`, the launcher's table): the weather of the five seeds settled at 10 500 to
# 13 000 steps (humidity the slow variable; kinetic energy 7 000 to 8 500, storms formed 7 000 to 11 000), so the
# launcher asks 1.3 x 13 000 = 17 000.
#
# The couplings (engine `alife run`, 3 000 steps from the founders after the 17 000 spin-up, seed 0): `rain_gain`
# 52 000 gave `rain_global_share` 6.1e-4; **71 000** gives 8.6e-4 (64k3s 8.5e-4, 128k3s 8.3e-4). The largest air speed an
# agent meets is 0.074 on average and 0.089 at the peak, so `storm_u0` 0.09 keeps the onset of the hazard just above it,
# as on 64k3s and 128k3s; no agent met a hazardous wind in those 3 000 steps (storm exposure 0; 128k3s 2e-7, 64k3s 6e-6).
# `storm_p` and `storm_span` are the box's.
#
# `weather.cells` is the weather Nside Nw (not a grid side) and must be Nf times a power of two. A pool is
# (x, y, sx, sy, amp, vx, vy) as in `stormsph`; `vx` -0.018 is the drift along the pool's own latitude circle per
# unit of weather time. The pools are `alife.analysis.w0_sphere.make_pools(180.0, 6, 44, 22)`.
# The vertical map of the shell onto the atmosphere is s = (H1 + H2)/H = 2 here.
[weather]
enabled = true
cells = 84
f0 = 0.025
seed_rate = 0.4
pools = [0.0, 125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 188.495559, 125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 376.991118, 125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 565.486678, 125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 753.982237, 125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 942.477796, 125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 94.24778, -125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 282.743339, -125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 471.238898, -125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 659.734457, -125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 848.230016, -125.663706, 44.0, 22.0, 1.0, -0.018, 0.0, 1036.725576, -125.663706, 44.0, 22.0, 1.0, -0.018, 0.0]
rain_gain = 71000.0
storm_p = 0.002
