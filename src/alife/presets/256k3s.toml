# 256k3s: an extra-large planet, 64k3s scaled by floor area at equal density (DESIGN section 46.9, an uncalibrated test of how
# large a planet the Mac can run). It is `64k3s.toml` with the radius 180.0 instead of 90: a floor area of 407 150 against
# 64k3s's 101 788 (4 times the area), n_max 262144 and n_init 65536 in proportion, HEALPix Nside 42
# (the pixel area stays 19.23 units^2, as in 64k3s, so food per unit of area is the same) and 18 equal-volume layers
# (381 024 field cells; the limit is 2^20 = 1 048 576), n_patches 32 and max_births_per_step 4096. Everything else is
# 64k3s's: the shell thickness 40, the physics, the economy, patch_sigma, regen_max 1 340 and cell_capacity 32.
# `world.size` is only the image length of min_image and must exceed 4 (radius + height) = 880.
#
# NOT CALIBRATED. 64k3s's regen_max 1 340 and hash capacity were measured on Metal for radius 90 (DESIGN 46.9); they were
# not measured here. The population level, the founders' boom and the hash occupancy at this size are untested, and no
# speed or memory has been measured. Only its storm weather is calibrated: the `stormsph256` overlay (row I101) is made
# for it; the other `stormsph` overlays are made for 64k3s, mini3s, tiny3s and 128k3s, and the engine refuses them on
# another shape. One key per line: the GUI reads the scalars of this file.
[population]
n_max = 262144
n_init = 65536
max_births_per_step = 4096

[world]
geometry = "sphere"
size = 1024.0
dims = 3
height = 40.0
radius = 180.0
nside = 42
layers = 18

[physics]
gravity = 0.015
floor_eps = 0.1
buoyancy_max = 0.04

[sensing]
k_neighbors = 8
cell_capacity = 32

[energy]
brain_cost_per_l1 = 0.0905
buoyancy_cost = 16
buoyancy_cap_cost = 8

[mutation]
buoy_init = 0.5
buoy_sigma = 0.02

[fields]
n_patches = 32
patch_sigma = 24.0
regen_max = 1340
chem_diffusion = [0.16, 0.10, 0.16]
benthic_lambda = 8.0
photic_amp = 0.5
photic_lambda = 8.0
