# stormsph22 overlay: the storm world's weather layer on the `mini3s` planet (docs/SPHERE.md 4 and 7.3, DESIGN §46.6, §46.9).
# A WORLD overlay, like `stormsph`: it needs the planet it is tuned for (Rp 48, H 24, field Nside 11 and 12 layers, so the
# weather Nside Nw = 2 Nf = 22, 5 808 cells of side 2.23, Courant 0.498) and fails validation on the others.
# PROVISIONAL, like `stormsph`: S4c calibrates it. It exists because `stormsph` (Rp 90, Nw 42) is refused on `mini3s`
# (Nw 42 is not Nf times a power of two, the pools lie beyond 2 pi Rp), and S4a found that Nw 22 holds storms only with
# narrower pools than the box's 32 x 16.
#
# `weather.cells` is the weather Nside Nw (not a grid side) and must be Nf times a power of two. A pool is
# (x, y, sx, sy, amp, vx, vy) with x the arc length east of longitude 0 and y the arc length north of the equator
# (lon = x/Rp, lat = y/Rp), sx and sy Gaussian widths in length, vx the drift along the pool's own latitude circle per
# unit of weather time, vy = 0. The six pools sit where `stormsph`'s do (latitude +-40 degrees, f at the pool 0.0162,
# three per hemisphere 120 degrees apart, the southern offset by 60) and are 24 x 16, the size of the spec (7.3).
# Measured on the engine's own weather (weather alone, 30 000 steps, seed 1, the storm layer of `alife play`; the
# measurement is recorded in DESIGN §46.9): 24 x 16 holds 2 to 3 named storms in each hemisphere at every detection
# after the first third (a lifetime of 28 600 steps), 20 x 12 holds 0 to 2 (mean 1.0 north, 0.6 south) and 16 x 10
# holds almost none (0.15 and 0.04). The drift is `stormsph`'s angular rate, -0.009·48/90 = -0.0048 (a lap in the same number of
# steps). The overlay does not set the weather time step, so it validates before and after the Courant change of S4b.
#
# The coupling values are PROVISIONAL (those of `stormsph`, which are those of `storm`). Not rescaled to the
# smaller planet and left to S4c: `seed_rate` (a probability per unit of weather time for the whole planet, whose
# area is 0.28 of the 64k3s one), the default `seed_sigma` and `rain_gain`. The vertical map of the shell onto the
# atmosphere is s = (H1 + H2)/H = 3.33 here (2 on 64k3s).
[weather]
enabled = true
cells = 22
f0 = 0.025
seed_rate = 0.02
pools = [50.265482, 33.510322, 24.0, 16.0, 1.0, -0.0048, 0.0, 150.796447, 33.510322, 24.0, 16.0, 1.0, -0.0048, 0.0, 251.327412, 33.510322, 24.0, 16.0, 1.0, -0.0048, 0.0, 0.0, -33.510322, 24.0, 16.0, 1.0, -0.0048, 0.0, 100.530965, -33.510322, 24.0, 16.0, 1.0, -0.0048, 0.0, 201.06193, -33.510322, 24.0, 16.0, 1.0, -0.0048, 0.0]
rain_gain = 50000.0
storm_p = 0.002
storm_u0 = 0.06
storm_span = 0.03
