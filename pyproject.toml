[project]
name = "alife"
version = "0.1.0"
description = "A neural artificial-life engine on Apple MLX: evolving agents with per-agent recurrent brains."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "mlx>=0.32.3,<0.33; sys_platform == 'darwin'",
  "mlx[cpu]>=0.32.3,<0.33; sys_platform == 'linux'",
  "numpy>=2.0",
]

[project.optional-dependencies]
viewer = ["pygame-ce>=2.5"]
video = ["imageio-ffmpeg>=0.5"]
analysis = ["matplotlib>=3.9"]  # plots of `alife activity` (alife.analysis.plots)

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
alife = "alife.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alife"]

[tool.uv]
# The engine targets macOS (Metal) and Linux (CPU CI); lock for exactly those platforms.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running (nightly)",
  "golden: MLX-version-pinned trajectory digest",
  "llm: needs a real LM Studio server (runs only with ALIFE_LLM_URL set, or with --model for the world report)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # DESIGN.md code blocks are aligned pseudocode, not formatted source

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
